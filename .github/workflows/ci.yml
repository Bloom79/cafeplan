name: CI — lint & build

# Branch work gets the same check the deploy runs, before it reaches main.
# main itself is covered by the lint step inside deploy.yml.
on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # UI smoke: real browser against the built site (~1 min).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
