name: Daily verify — listings watch & discovery

# Every morning: re-check every watchlist listing against the live web and
# discover new Edinburgh going-concerns via the Copilot CLI, then commit the
# updated public/listings.json (which the app fetches at runtime).

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      discover:
        description: 'Also search for new listings (beyond the Monday default)'
        type: boolean
        default: false
      force:
        description: 'Re-check every listing now, ignoring the cadence'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies + Copilot CLI
        run: npm ci --omit=dev && npm install -g @github/copilot

      - name: Run verify agent (all listings; discovery Mondays or on demand)
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.G_COPILOT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERIFY_DEBUG: '1'
        run: |
          FLAGS=""
          [ "$(date +%u)" = "1" ] && FLAGS="--discover"
          [ "${{ inputs.discover }}" = "true" ] && FLAGS="--discover"
          [ "${{ inputs.force }}" = "true" ] && FLAGS="$FLAGS --force"
          node scripts/verifica.mjs --all $FLAGS

      - name: Commit updated listings
        run: |
          git config user.name "cafeplan-agent"
          git config user.email "actions@github.com"
          git add public/listings.json
          git diff --cached --quiet && echo "no changes" || (git commit -m "daily verify: refresh listings [skip ci]" && git push)

      # Wake the alert notifier: it diffs listings.json and pushes to subscribers.
      - name: Notify alert subscribers
        run: curl -sf -X POST https://cafeplan-verify.casatrova.workers.dev/check || true
